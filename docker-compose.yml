services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: /etc/hayhome/backend.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/lib/hayhome:/var/lib/hayhome

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
